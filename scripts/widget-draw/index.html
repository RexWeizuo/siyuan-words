<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root { --bg: #1e1e1e; --surface: #2d2d2d; --text: #ccc; --border: #444; --accent: #3574f0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  #toolbar {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  #toolbar button {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 13px;
    white-space: nowrap;
  }
  #toolbar button.active { background: var(--accent); border-color: var(--accent); }
  #toolbar button:hover { opacity: 0.8; }
  #toolbar input[type="color"] {
    width: 28px; height: 28px; border: 1px solid var(--border);
    border-radius: 4px; cursor: pointer; background: transparent; padding: 2px;
  }
  #toolbar input[type="range"] { width: 60px; cursor: pointer; }
  #toolbar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
  #toolbar .hint { font-size: 11px; color: #888; margin-left: auto; }
  #canvas-wrap { flex: 1; position: relative; overflow: hidden; cursor: crosshair; }
  canvas { position: absolute; top: 0; left: 0; touch-action: none; }
</style>
</head>
<body>

<div id="toolbar">
  <button id="btn-pen" class="active">笔</button>
  <button id="btn-eraser">橡皮</button>
  <span class="sep"></span>
  <input type="color" id="color" value="#ffffff">
  <span style="font-size:12px">粗细</span>
  <input type="range" id="size" min="0.3" max="6" value="1.2" step="0.1">
  <span id="size-val" style="font-size:12px;min-width:24px">1.2</span>
  <span class="sep"></span>
  <button id="btn-undo">撤销</button>
  <button id="btn-clear">清空</button>
  <button id="btn-fullscreen">全屏</button>
  <button id="btn-save">保存</button>
  <span class="hint">笔触: <span id="pressure-hint">-</span></span>
</div>

<div id="canvas-wrap"><canvas id="c"></canvas></div>

<script>
const wrap = document.getElementById('canvas-wrap');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const P = window.parent;
const PD = P.document;

let tool = 'pen';
let color = '#ffffff';
let penSize = 1.2;
let eraserSize = 10;

const undoStack = [];
const MAX_UNDO = 50;
let drawing = false;
let strokePoints = []; // collected points for current stroke

// ---- OneNote-style inking ----
// Non-linear pressure curve: gives more control in the light range
// pow(0.55) compresses high pressure slightly, expands mid-range
function inkWidth(pressure) {
  const p = Math.pow(pressure, 0.55);
  return penSize * 2 * p;
}

// Smooth a point array with a simple moving average (reduces jitter)
function smoothPoints(pts, windowSize) {
  if (pts.length < 3) return pts;
  const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++) {
    const len = Math.min(windowSize, i + 1, pts.length - i);
    let sx = 0, sy = 0, sp = 0, n = 0;
    for (let j = -Math.floor(len/2); j <= Math.floor(len/2); j++) {
      sx += pts[i+j].x; sy += pts[i+j].y; sp += pts[i+j].p; n++;
    }
    out.push({ x: sx/n, y: sy/n, p: sp/n });
  }
  out.push(pts[pts.length-1]);
  return out;
}

// Draw the stroke with variable width — tapered ends, smooth transitions
function drawInkStroke(pts, g) {
  if (pts.length < 2) return;

  // Smooth raw points
  const raw = smoothPoints(pts, 3);

  // Build segments with widths
  const segs = raw.map((pt, i) => {
    let p = pt.p;
    // Taper: first and last 15% of stroke fade in/out
    const len = raw.length;
    const t = i / Math.max(len - 1, 1);
    const taper = Math.min(t / 0.15, (1 - t) / 0.15, 1);
    const w = inkWidth(p) * Math.max(taper, 0.2);
    return { ...pt, w };
  });

  // Draw using filled trapezoids between consecutive points
  g.fillStyle = color;
  g.strokeStyle = color;
  g.lineCap = 'round';
  g.lineJoin = 'round';

  // Draw the core path with varying width using overlapping circles + trapezoids
  for (let i = 0; i < segs.length - 1; i++) {
    const a = segs[i], b = segs[i+1];
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 0.5) continue;

    const nx = -dy / dist, ny = dx / dist;

    // Trapezoid: (a-, a+, b+, b-)
    const a1x = a.x + nx * a.w/2, a1y = a.y + ny * a.w/2;
    const a2x = a.x - nx * a.w/2, a2y = a.y - ny * a.w/2;
    const b1x = b.x + nx * b.w/2, b1y = b.y + ny * b.w/2;
    const b2x = b.x - nx * b.w/2, b2y = b.y - ny * b.w/2;

    g.beginPath();
    g.moveTo(a1x, a1y);
    g.lineTo(b1x, b1y);
    g.lineTo(b2x, b2y);
    g.lineTo(a2x, a2y);
    g.closePath();
    g.fill();
  }

  // Cap circle at each point for smooth joins
  for (const pt of segs) {
    g.beginPath();
    g.arc(pt.x, pt.y, pt.w / 2, 0, Math.PI * 2);
    g.fill();
  }
}

function resizeCanvas(cv, parent) {
  const r = parent.getBoundingClientRect();
  const dpr = P.devicePixelRatio || 1;
  const w = r.width, h = r.height;
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  cv.width = w * dpr;
  cv.height = h * dpr;
  const g = cv.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.scale(dpr, dpr);
}

function resize() { resizeCanvas(canvas, wrap); }
resize();
window.addEventListener('resize', resize);

// ---- fullscreen (parent document) ----
let parentOverlay = null;
let parentCanvas = null;

function getActiveCanvas() { return parentCanvas || canvas; }
function getActiveCtx() { return getActiveCanvas().getContext('2d'); }

const TOOLBAR_HTML = `
<div id="siyuan-draw-fs-tb" style="display:flex;align-items:center;gap:6px;padding:8px 12px;background:#2d2d2d;border-bottom:1px solid #444;flex-wrap:wrap;flex-shrink:0;">
  <button id="sdf-btn-pen" class="sdf-active" style="background:#3574f0;border:1px solid #444;color:#ccc;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:13px;">笔</button>
  <button id="sdf-btn-eraser" style="background:transparent;border:1px solid #444;color:#ccc;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:13px;">橡皮</button>
  <span style="width:1px;height:20px;background:#444;margin:0 4px"></span>
  <input type="color" id="sdf-color" value="${color}" style="width:28px;height:28px;border:1px solid #444;border-radius:4px;cursor:pointer;background:transparent;padding:2px">
  <span style="font-size:12px;color:#ccc">粗细</span>
  <input type="range" id="sdf-size" min="0.3" max="6" value="${penSize}" step="0.1" style="width:60px;cursor:pointer">
  <span id="sdf-size-val" style="font-size:12px;color:#ccc;min-width:24px">${penSize}</span>
  <span style="width:1px;height:20px;background:#444;margin:0 4px"></span>
  <button id="sdf-btn-undo" style="background:transparent;border:1px solid #444;color:#ccc;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:13px;">撤销</button>
  <button id="sdf-btn-clear" style="background:transparent;border:1px solid #444;color:#ccc;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:13px;">清空</button>
  <button id="sdf-btn-exit" style="background:transparent;border:1px solid #444;color:#ccc;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:13px;">退出</button>
  <button id="sdf-btn-save" style="background:transparent;border:1px solid #444;color:#ccc;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:13px;">保存</button>
  <span id="sdf-pressure" style="font-size:11px;color:#888;margin-left:auto">笔触: -</span>
</div>`;

function enterFullscreen() {
  parentOverlay = PD.createElement('div');
  parentOverlay.id = 'siyuan-draw-fs';
  parentOverlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:99999;background:#1e1e1e;display:flex;flex-direction:column;';
  parentOverlay.innerHTML = TOOLBAR_HTML + '<div id="siyuan-draw-fs-wrap" style="flex:1;position:relative;overflow:hidden;cursor:crosshair"><canvas id="siyuan-draw-fs-cv" style="position:absolute;top:0;left:0;touch-action:none"></canvas></div>';
  PD.body.appendChild(parentOverlay);
  parentCanvas = PD.getElementById('siyuan-draw-fs-cv');
  const pw = PD.getElementById('siyuan-draw-fs-wrap');
  resizeCanvas(parentCanvas, pw);
  parentCanvas.getContext('2d').drawImage(canvas, 0, 0);
  bindFullscreenEvents(pw, parentCanvas);
  updateFullscreenToolUI();
  document.getElementById('btn-fullscreen').textContent = '退出';
  document.getElementById('btn-fullscreen').classList.add('active');
  window.addEventListener('resize', onParentResize);
}

function exitFullscreen() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(parentCanvas, 0, 0);
  window.removeEventListener('resize', onParentResize);
  PD.body.removeChild(parentOverlay);
  parentCanvas = null; parentOverlay = null;
  resizeCanvas(canvas, wrap);
  document.getElementById('btn-fullscreen').textContent = '全屏';
  document.getElementById('btn-fullscreen').classList.remove('active');
}

function onParentResize() {
  if (!parentCanvas) return;
  resizeCanvas(parentCanvas, PD.getElementById('siyuan-draw-fs-wrap'));
}

function updateFullscreenToolUI() {
  const penBtn = PD.getElementById('sdf-btn-pen');
  const eraserBtn = PD.getElementById('sdf-btn-eraser');
  if (tool === 'eraser') {
    eraserBtn.style.background = '#3574f0'; penBtn.style.background = 'transparent';
  } else {
    penBtn.style.background = '#3574f0'; eraserBtn.style.background = 'transparent';
  }
  PD.getElementById('sdf-size').value = (tool === 'eraser') ? eraserSize : penSize;
  PD.getElementById('sdf-size-val').textContent = (tool === 'eraser') ? eraserSize : penSize;
}

function bindFullscreenEvents(pw, pcv) {
  PD.getElementById('sdf-btn-pen').addEventListener('click', () => { tool='pen'; pw.style.cursor='crosshair'; updateFullscreenToolUI(); });
  PD.getElementById('sdf-btn-eraser').addEventListener('click', () => { tool='eraser'; pw.style.cursor='cell'; updateFullscreenToolUI(); });
  PD.getElementById('sdf-color').addEventListener('input', (e) => color = e.target.value);
  PD.getElementById('sdf-size').addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    if (tool === 'eraser') eraserSize = v; else penSize = v;
    PD.getElementById('sdf-size-val').textContent = v;
  });
  PD.getElementById('sdf-btn-undo').addEventListener('click', undoSnapshot);
  PD.getElementById('sdf-btn-clear').addEventListener('click', clearAll);
  PD.getElementById('sdf-btn-exit').addEventListener('click', exitFullscreen);
  PD.getElementById('sdf-btn-save').addEventListener('click', () => {
    const l = PD.createElement('a');
    l.download = 'drawing-' + new Date().toISOString().slice(0,19).replace(/:/g,'-') + '.png';
    l.href = pcv.toDataURL('image/png'); l.click();
  });

  const pressHint = PD.getElementById('sdf-pressure');
  bindCanvasEvents(pcv, pw, pressHint, pcv.getContext('2d'));
}

// ---- shared canvas event binding ----
function bindCanvasEvents(cv, parent, pressHint, g) {
  function getPos(e) {
    const r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top, p: e.pressure || 0.5, t: Date.now() };
  }

  cv.addEventListener('pointerdown', (e) => {
    drawing = true; strokePoints = [getPos(e)];
    pressHint.textContent = strokePoints[0].p.toFixed(2);
    snapshot();
    if (tool === 'eraser') {
      g.globalCompositeOperation = 'destination-out';
      g.fillStyle = 'rgba(0,0,0,1)';
      g.beginPath(); g.arc(strokePoints[0].x, strokePoints[0].y, eraserSize/2, 0, Math.PI*2); g.fill();
      g.globalCompositeOperation = 'source-over';
    } else {
      // Draw a dot at start (for tap)
      const w = inkWidth(strokePoints[0].p);
      g.fillStyle = color;
      g.beginPath(); g.arc(strokePoints[0].x, strokePoints[0].y, w/2, 0, Math.PI*2); g.fill();
    }
  });

  cv.addEventListener('pointermove', (e) => {
    if (!drawing) return;
    const p = getPos(e);
    pressHint.textContent = p.p.toFixed(2);
    strokePoints.push(p);

    if (tool === 'eraser') {
      g.globalCompositeOperation = 'destination-out';
      g.beginPath();
      g.arc(p.x, p.y, eraserSize/2, 0, Math.PI*2); g.fill();
      g.globalCompositeOperation = 'source-over';
    }
  });

  cv.addEventListener('pointerup', () => {
    if (!drawing) return;
    if (tool === 'pen' && strokePoints.length >= 2) {
      drawInkStroke(strokePoints, g);
    }
    drawing = false; strokePoints = [];
  });
  cv.addEventListener('pointerleave', () => { drawing = false; strokePoints = []; });
}

bindCanvasEvents(canvas, wrap, document.getElementById('pressure-hint'), ctx);

// ---- drawing ops ----
function snapshot() {
  const cv = getActiveCanvas();
  const c = cv.getContext('2d');
  if (undoStack.length >= MAX_UNDO) undoStack.shift();
  undoStack.push(c.getImageData(0, 0, cv.width, cv.height));
}
function undoSnapshot() {
  if (undoStack.length === 0) return;
  const cv = getActiveCanvas();
  const c = cv.getContext('2d');
  c.putImageData(undoStack.pop(), 0, 0);
}
function clearAll() {
  snapshot();
  const cv = getActiveCanvas();
  const c = cv.getContext('2d');
  c.clearRect(0, 0, cv.width, cv.height);
}

// ---- toolbar ----
const sizeInput = document.getElementById('size');
const sizeVal = document.getElementById('size-val');
function updateSizeUI() {
  if (tool === 'eraser') { sizeInput.value = eraserSize; sizeVal.textContent = eraserSize; }
  else { sizeInput.value = penSize; sizeVal.textContent = penSize; }
}

document.getElementById('btn-pen').addEventListener('click', function() {
  tool='pen'; this.classList.add('active');
  document.getElementById('btn-eraser').classList.remove('active');
  canvas.style.cursor='crosshair'; updateSizeUI();
});
document.getElementById('btn-eraser').addEventListener('click', function() {
  tool='eraser'; this.classList.add('active');
  document.getElementById('btn-pen').classList.remove('active');
  canvas.style.cursor='cell'; updateSizeUI();
});
document.getElementById('color').addEventListener('input', (e) => color = e.target.value);
sizeInput.addEventListener('input', (e) => {
  const v = parseFloat(e.target.value);
  if (tool === 'eraser') eraserSize = v; else penSize = v;
  sizeVal.textContent = v;
});
document.getElementById('btn-undo').addEventListener('click', undoSnapshot);
document.getElementById('btn-clear').addEventListener('click', clearAll);
document.getElementById('btn-save').addEventListener('click', () => {
  const l = document.createElement('a');
  l.download = 'drawing-' + new Date().toISOString().slice(0,19).replace(/:/g,'-') + '.png';
  l.href = canvas.toDataURL('image/png'); l.click();
});

document.getElementById('btn-fullscreen').addEventListener('click', () => {
  if (parentOverlay) exitFullscreen(); else enterFullscreen();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && parentOverlay) { e.preventDefault(); exitFullscreen(); }
  if (e.ctrlKey && e.key === 'z' && !e.target.closest('input')) { e.preventDefault(); undoSnapshot(); }
});
</script>
</body>
</html>
