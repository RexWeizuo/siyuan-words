<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root { --bg: #1e1e1e; --surface: #2d2d2d; --text: #ccc; --border: #444; --accent: #3574f0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  #toolbar {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  #toolbar button {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 13px;
    white-space: nowrap;
  }
  #toolbar button.active { background: var(--accent); border-color: var(--accent); }
  #toolbar button:hover { opacity: 0.8; }
  #toolbar input[type="color"] {
    width: 28px; height: 28px; border: 1px solid var(--border);
    border-radius: 4px; cursor: pointer; background: transparent; padding: 2px;
  }
  #toolbar input[type="range"] { width: 60px; cursor: pointer; }
  #toolbar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
  #toolbar .hint { font-size: 11px; color: #888; margin-left: auto; }
  #canvas-wrap { flex: 1; position: relative; overflow: hidden; cursor: crosshair; }
  canvas { position: absolute; top: 0; left: 0; touch-action: none; }

  /* fullscreen overlay */
  #fullscreen-overlay {
    display: none;
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: 99999; background: var(--bg);
    flex-direction: column;
  }
  #fullscreen-overlay.active { display: flex; }
</style>
</head>
<body>

<div id="toolbar">
  <button id="btn-pen" class="active">笔</button>
  <button id="btn-eraser">橡皮</button>
  <span class="sep"></span>
  <input type="color" id="color" value="#ffffff">
  <span style="font-size:12px">粗细</span>
  <input type="range" id="size" min="0.5" max="20" value="2.5" step="0.5">
  <span id="size-val" style="font-size:12px;min-width:24px">2.5</span>
  <span class="sep"></span>
  <button id="btn-undo">撤销</button>
  <button id="btn-clear">清空</button>
  <button id="btn-fullscreen">全屏</button>
  <button id="btn-save">保存</button>
  <span class="hint">笔触: <span id="pressure-hint">-</span></span>
</div>

<div id="canvas-wrap"><canvas id="c"></canvas></div>

<div id="fullscreen-overlay">
  <canvas id="fc"></canvas>
</div>

<script>
const wrap = document.getElementById('canvas-wrap');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const overlay = document.getElementById('fullscreen-overlay');
const fcanvas = document.getElementById('fc');
const fctx = fcanvas.getContext('2d');

let tool = 'pen';
let color = '#ffffff';
let penSize = 2.5;
let eraserSize = 10;
let fullscreen = false;

const undoStack = [];
const MAX_UNDO = 50;

let drawing = false;
let currentPath = [];

function resizeCanvas(cv, parent) {
  const r = parent.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = r.width, h = r.height;
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  cv.width = w * dpr;
  cv.height = h * dpr;
  const g = cv.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.scale(dpr, dpr);
}

function resize() {
  resizeCanvas(canvas, wrap);
  resizeCanvas(fcanvas, overlay);
}
resize();
window.addEventListener('resize', resize);

// ---- active canvas ----
function activeCtx() { return fullscreen ? fctx : ctx; }
function activeCanvas() { return fullscreen ? fcanvas : canvas; }

function snapshot() {
  const c = activeCtx();
  const cv = activeCanvas();
  if (undoStack.length >= MAX_UNDO) undoStack.shift();
  undoStack.push(c.getImageData(0, 0, cv.width, cv.height));
}

function undo() {
  if (undoStack.length === 0) return;
  const c = activeCtx();
  const cv = activeCanvas();
  const img = undoStack.pop();
  c.putImageData(img, 0, 0);
}

function clearAll() {
  snapshot();
  const c = activeCtx();
  const cv = activeCanvas();
  c.clearRect(0, 0, cv.width, cv.height);
}

// ---- pointer events ----
function getPos(e) {
  const cv = activeCanvas();
  const r = cv.getBoundingClientRect();
  const p = e.pressure || 0.5;
  return { x: e.clientX - r.left, y: e.clientY - r.top, pressure: p };
}

function onPointerDown(e) {
  drawing = true;
  const c = activeCtx();
  const p = getPos(e);
  document.getElementById('pressure-hint').textContent = p.pressure.toFixed(2);
  snapshot();

  if (tool === 'eraser') {
    c.globalCompositeOperation = 'destination-out';
    c.fillStyle = 'rgba(0,0,0,1)';
    c.beginPath();
    c.arc(p.x, p.y, eraserSize / 2, 0, Math.PI * 2);
    c.fill();
    c.globalCompositeOperation = 'source-over';
  } else {
    currentPath = [p];
    c.strokeStyle = color;
    c.lineWidth = penSize * p.pressure * 2;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.beginPath();
    c.moveTo(p.x, p.y);
  }
}

function onPointerMove(e) {
  if (!drawing) return;
  const c = activeCtx();
  const p = getPos(e);
  document.getElementById('pressure-hint').textContent = p.pressure.toFixed(2);

  if (tool === 'eraser') {
    c.globalCompositeOperation = 'destination-out';
    c.beginPath();
    c.arc(p.x, p.y, eraserSize / 2, 0, Math.PI * 2);
    c.fill();
    c.globalCompositeOperation = 'source-over';
  } else {
    currentPath.push(p);
    if (currentPath.length > 3) {
      const len = currentPath.length;
      const b = currentPath[len - 2];
      const c2 = currentPath[len - 1];
      const mid = { x: (currentPath[len-2].x + currentPath[len-3].x)/2, y: (currentPath[len-2].y + currentPath[len-3].y)/2 };
      const end = { x: (b.x + c2.x) / 2, y: (b.y + c2.y) / 2 };
      c.strokeStyle = color;
      c.lineWidth = penSize * b.pressure * 2;
      c.quadraticCurveTo(b.x, b.y, end.x, end.y);
      c.stroke();
      c.beginPath();
      c.moveTo(end.x, end.y);
    } else {
      c.lineTo(p.x, p.y);
      c.lineWidth = penSize * p.pressure * 2;
      c.stroke();
    }
  }
}

function onPointerUp() {
  if (!drawing) return;
  drawing = false;
  currentPath = [];
  if (tool !== 'eraser') activeCtx().closePath();
}

function onPointerLeave() { drawing = false; currentPath = []; }

canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointermove', onPointerMove);
canvas.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('pointerleave', onPointerLeave);
fcanvas.addEventListener('pointerdown', onPointerDown);
fcanvas.addEventListener('pointermove', onPointerMove);
fcanvas.addEventListener('pointerup', onPointerUp);
fcanvas.addEventListener('pointerleave', onPointerLeave);

// ---- fullscreen ----
function enterFullscreen() {
  // copy current drawing to fullscreen canvas
  if (fcanvas.width !== canvas.width || fcanvas.height !== canvas.height) {
    resizeCanvas(fcanvas, overlay);
  }
  fctx.clearRect(0, 0, fcanvas.width, fcanvas.height);
  fctx.drawImage(canvas, 0, 0);
  fullscreen = true;
  overlay.classList.add('active');
  document.getElementById('btn-fullscreen').textContent = '退出';
  document.getElementById('btn-fullscreen').classList.add('active');
  resizeCanvas(fcanvas, overlay);
}

function exitFullscreen() {
  // copy fullscreen drawing back to main canvas
  if (canvas.width !== fcanvas.width || canvas.height !== fcanvas.height) {
    resizeCanvas(canvas, wrap);
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(fcanvas, 0, 0);
  fullscreen = false;
  overlay.classList.remove('active');
  document.getElementById('btn-fullscreen').textContent = '全屏';
  document.getElementById('btn-fullscreen').classList.remove('active');
  resizeCanvas(canvas, wrap);
}

document.getElementById('btn-fullscreen').addEventListener('click', () => {
  if (fullscreen) exitFullscreen();
  else enterFullscreen();
});

// keyboard: Escape to exit fullscreen
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && fullscreen) { e.preventDefault(); exitFullscreen(); }
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
});

// ---- toolbar ----
const sizeInput = document.getElementById('size');
const sizeVal = document.getElementById('size-val');

function updateSizeUI() {
  if (tool === 'eraser') {
    sizeInput.value = eraserSize;
    sizeVal.textContent = eraserSize;
  } else {
    sizeInput.value = penSize;
    sizeVal.textContent = penSize;
  }
}

document.getElementById('btn-pen').addEventListener('click', function() {
  tool = 'pen';
  this.classList.add('active');
  document.getElementById('btn-eraser').classList.remove('active');
  activeCanvas().style.cursor = 'crosshair';
  updateSizeUI();
});
document.getElementById('btn-eraser').addEventListener('click', function() {
  tool = 'eraser';
  this.classList.add('active');
  document.getElementById('btn-pen').classList.remove('active');
  activeCanvas().style.cursor = 'cell';
  updateSizeUI();
});
document.getElementById('color').addEventListener('input', (e) => color = e.target.value);
sizeInput.addEventListener('input', (e) => {
  const v = parseFloat(e.target.value);
  if (tool === 'eraser') eraserSize = v;
  else penSize = v;
  sizeVal.textContent = v;
});
document.getElementById('btn-undo').addEventListener('click', undo);
document.getElementById('btn-clear').addEventListener('click', clearAll);
document.getElementById('btn-save').addEventListener('click', () => {
  const cv = activeCanvas();
  const link = document.createElement('a');
  link.download = 'drawing-' + new Date().toISOString().slice(0,19).replace(/:/g,'-') + '.png';
  link.href = cv.toDataURL('image/png');
  link.click();
});
</script>
</body>
</html>
